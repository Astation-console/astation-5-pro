<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,#game{margin:0;width:100%;height:100%;background:#000}</style></head><body><div id="game"></div><script>
'use strict';let launched=false,url=null,started=false;
const post=(event,extra={})=>parent.postMessage({source:'astation-gba-player',event,...extra},location.origin);
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||e.data?.source!=='astation-gba-host')return;const d=e.data;if(d.event==='start'&&!launched){launched=true;if(!(d.blob instanceof Blob)){post('error',{message:'Brak ROM-u'});return}url=URL.createObjectURL(d.blob);window.EJS_player='#game';window.EJS_core='gba';window.EJS_controlScheme='gba';window.EJS_gameUrl=url;window.EJS_gameName='ASTATION_GBA_'+d.profile+'_'+d.sha.slice(0,16);window.EJS_gameID=parseInt(d.sha.slice(0,7),16);window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';window.EJS_threads=false;window.EJS_startOnLoaded=false;window.EJS_fixedSaveInterval=10000;window.EJS_ready=()=>post('core-ready');window.EJS_onGameStart=()=>{started=true;post('started')};const s=document.createElement('script');s.src=window.EJS_pathtodata+'loader.js';s.onerror=()=>post('error',{message:'Nie można pobrać rdzenia'});document.head.append(s)}else if(d.event==='pause'){window.EJS_emulator?.pause?.()}else if(d.event==='resume'){window.EJS_emulator?.play?.()}else if(d.event==='save'){try{const gm=window.EJS_emulator?.gameManager;if(!started||!gm?.saveSaveFiles)throw Error('unsupported');Promise.resolve(gm.saveSaveFiles()).then(()=>post('saved',{ok:true}),()=>post('saved',{ok:false}))}catch{post('saved',{ok:false})}}});window.addEventListener('pagehide',()=>{if(url)URL.revokeObjectURL(url)});post('ready');
</script></body></html>
