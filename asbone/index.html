function click(e){let b=e.target.closest('button');if(!b||b.disabled)return;let d=b.dataset;if(d.vrEvent){data.event=d.vrEvent;persist();showHub();return}if(d.vrLevel){data.level=d.vrLevel;persist();showHub();return}if(d.vrTab){tab=d.vrTab;showHub();return}if(d.vrTrack!==undefined){selected=Number(d.vrTrack);let old=screen.scrollTop;showHub();screen.scrollTop=old;return}if(d.vrShip!==undefined){let i=Number(d.vrShip),s=ships[i];if(!data.owned.includes(i)){if(data.credits<s.price){toast('Brakuje '+(s.price-data.credits)+' KR');return}data.credits-=s.price;data.owned.push(i)}data.ship=i;persist();showHub();return}if(d.vrUp){let u=defs.find(v=>v.id===d.vrUp),n=data.up[u.id],c=u.cost*(n+1);if(n>=3)return;if(data.credits<c){toast('Brakuje '+(c-data.credits)+' KR');return}data.credits-=c;data.up[u.id]++;persist();showHub();return}switch(d.vr){case 'newcup':data.cup=null;case 'startcup':data.event='cup';start();break;case 'start':case 'retry':start();break;case 'hub':tab='race';showHub();break;case 'resume':resume();break;case 'sound':data.sound=!data.sound;persist();if(data.sound)tone('pad');showHub();break}}
screen.addEventListener('click',click);modal.addEventListener('click',click);$('#vr-pause').addEventListener('click',()=>{if(mode==='pause')resume();else pause()});
controls.querySelectorAll('[data-vr-hold]').forEach(b=>{let k=b.dataset.vrHold;b.addEventListener('pointerdown',e=>{e.preventDefault();if(mode!=='race'&&mode!=='count')return;pointerMap.set(e.pointerId,k);held[k]=true;b.classList.add('held');b.setPointerCapture?.(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,e=>{if(pointerMap.get(e.pointerId)!==k)return;pointerMap.delete(e.pointerId);held[k]=false;b.classList.remove('held')})});
function keyDown(e){if(mode!=='race'&&mode!=='count'&&mode!=='pause')return;let k=({a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right',Shift:'drift',' ':'boost'})[e.key];if(k){e.preventDefault();held[k]=true}if(e.key==='Escape'&&!e.repeat){if(mode==='pause')resume();else pause()}}function keyUp(e){let k=({a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right',Shift:'drift',' ':'boost'})[e.key];if(k)held[k]=false}
const vis=()=>{if(document.hidden)pause();last=0};window.addEventListener('keydown',keyDown);window.addEventListener('keyup',keyUp);document.addEventListener('visibilitychange',vis);showHub();raf=requestAnimationFrame(loop);
return{destroy(){stopEngine();alive=false;cancelAnimationFrame(raf);ro?.disconnect();window.removeEventListener('keydown',keyDown);window.removeEventListener('keyup',keyUp);document.removeEventListener('visibilitychange',vis);if(audio)audio.close().catch(()=>{})}}
}

function calculate(k){let n=Number(calc);if(k==='AC'){calc='0';operand=operator=null;fresh=false;return}if(k==='±'){calc=String(-n);return}if(k==='%'){calc=String(n/100);return}if(['+','−','×','÷','='].includes(k)){if(operand!==null&&!fresh){n=operator==='+'?operand+n:operator==='−'?operand-n:operator==='×'?operand*n:operand/n;calc=Number.isFinite(n)?String(Number(n.toPrecision(11))):'Błąd'}if(k==='='){operand=operator=null}else{operand=n;operator=k}fresh=true;return}if(fresh||calc==='Błąd'){calc='0';fresh=false}if(k==='.'&&calc.includes('.'))return;calc=k==='.'?calc+'.':calc==='0'?k:calc+k;calc=calc.slice(0,15)}
device.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.go){if(b.classList.contains('app'))launchRect=b.querySelector('.ico').getBoundingClientRect();go(d.go);return}if(d.page!==undefined){homePage=Number(d.page);render();view.querySelector('.apps')?.animate([{opacity:0,transform:'translateX(20px)'},{opacity:1,transform:'none'}],{duration:250,easing:'ease-out'});return}if(d.toggle){state[d.toggle]=!state[d.toggle];if(d.toggle==='wifi'&&state.wifi)state.air=false;if(d.toggle==='air'&&state.air)state.wifi=false;save();render();return}if(d.wall!==undefined){state.wall=+d.wall;save();render();toast('Tapeta ustawiona');return}if(d.install){if(installing||state.installed.includes(d.install))return;let id=d.install;installing=id;render();setTimeout(()=>{state.installed.push(id);installing=null;notify('Zainstalowano '+apps[id][0]);if(page==='store'||page==='home')render()},850);return}if(d.tab){tab=d.tab;render();return}if(d.key){calculate(d.key);render();return}if(d.dial){dial=(dial+d.dial).slice(0,18);render();return}switch(d.act){case 'clearrecent':recents=[];render();break;case 'closecontrol':go(prev==='control'?'home':prev);break;case 'update':toast('AB OS 2.0 — aktualna wersja prototypu');break;case 'clear':state.notifications=[];save();render();break;case 'savenote':save();toast('Notatka zapisana');break;case 'pickphoto':$('#pickphoto').click();break;case 'deldial':dial=dial.slice(0,-1);render();break;case 'call':toast('Połączenia niedostępne w symulatorze');break;case 'send':{let m=$('#message').value.trim();if(m){state.messages.push(m);save();render()}break}case 'search':search=$('#query').value.trim();render();break;}});
device.addEventListener('input',e=>{let el=e.target;if(el.id==='note'){state.notes=el.value;save()}if(el.id==='brightness'){state.brightness=+el.value;status();$('#brightval').textContent=el.value+'%';save()}if(el.id==='librarysearch'){let q=el.value.trim().toLowerCase();let ids=[...new Set([...primary,...dockIds,...state.installed])].filter(id=>apps[id][0].toLowerCase().includes(q));$('#librarylist').innerHTML=q?'<div class="apps" style="grid-column:1/-1">'+(ids.map(app).join('')||'<p>Brak wyników</p>')+'</div>':groups().map(([name,ids])=>'<section class="librarygroup"><div class="apps">'+ids.map(app).join('')+'</div><h3>'+name+'</h3></section>').join('')}if(el.id==='storesearch'){let q=el.value.toLowerCase();$('#storelist').innerHTML=(tab==='mine'?state.installed:['game','music','files','studio']).filter(id=>apps[id][0].toLowerCase().includes(q)).map(listing).join('')||'<p class="muted">Brak wyników</p>'}});
device.addEventListener('change',e=>{let f=e.target.files?.[0];if(!f)return;if(e.target.id==='audiofile'){let p=$('#player');p.src=URL.createObjectURL(f)}if(e.target.id==='pickphoto'){if(!f.type.startsWith('image/'))return;let url=URL.createObjectURL(f),img=new Image();img.onload=()=>{let c=document.createElement('canvas'),r=Math.min(1,720/Math.max(img.width,img.height));c.width=img.width*r;c.height=img.height*r;c.getContext('2d').drawImage(img,0,0,c.width,c.height);state.photos.push(c.toDataURL('image/jpeg',.72));state.photos=state.photos.slice(-10);URL.revokeObjectURL(url);save();go('photos');toast('Zdjęcie dodane do galerii')};img.src=url}});
let touch=null;let barHold=null;const bar=device.querySelector('.homebar');bar.addEventListener('pointerdown',()=>{barHold=setTimeout(()=>{barHold=null;go('recent');bar.dataset.held='1'},450)});['pointerup','pointercancel','pointerleave'].forEach(ev=>bar.addEventListener(ev,()=>{clearTimeout(barHold)}));bar.addEventListener('click',e=>{if(bar.dataset.held){e.stopPropagation();delete bar.dataset.held}},true);device.addEventListener('touchstart',e=>{if(e.target.closest('.orbit-stage,.od-stage,.vr-stage')){touch=null;return}touch={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});device.addEventListener('touchend',e=>{if(!touch)return;let dy=e.changedTouches[0].clientY-touch.y,dx=e.changedTouches[0].clientX-touch.x;if(page==='home'&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){let next=homePage+(dx<0?1:-1);if(next>1)go('library');else if(next>=0){homePage=next;render();view.querySelector('.apps')?.animate([{opacity:0,transform:'translateX('+(dx<0?35:-35)+'px)'},{opacity:1,transform:'none'}],{duration:260,easing:'cubic-bezier(.2,.75,.22,1)'})}}else if(Math.abs(dy)>65&&Math.abs(dy)>Math.abs(dx)*1.5){let rect=device.getBoundingClientRect();if(dy<0&&(page==='lock'||touch.y>rect.bottom-35))go('home');else if(dy>0&&touch.y<rect.top+65)go('control');else if(dy>0&&page==='home')go('library')}touch=null},{passive:true});setInterval(()=>{status();['widgettime','locktime','appclock'].forEach(id=>{let e=document.getElementById(id);if(e)e.textContent=time()})},15000);render();
</script></body></html>
