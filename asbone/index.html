case 'control':h='<div class="head"><button class="back" data-act="closecontrol">'+svg(icons.back)+'</button><h1>Centrum sterowania</h1></div><div class="grid2">'+[['wifi','Wi-Fi'],['bt','Bluetooth'],['air','Tryb samolotowy']].map(([id,label])=>'<button class="controlbtn '+(state[id]?'on':'')+'" data-toggle="'+id+'">'+svg(icons[id])+label+'</button>').join('')+'<button class="controlbtn" data-go="lock">'+svg(icons.lock)+'Zablokuj</button></div><div class="panel">Jasność <b id="brightval">'+state.brightness+'%</b><input class="range" type="range" min="25" max="100" id="brightness" value="'+state.brightness+'"></div><div class="row"><h3>Powiadomienia</h3><button class="soft" data-act="clear">Wyczyść</button></div><div class="panel">'+(state.notifications.length?state.notifications.slice(-5).reverse().map(n=>'<div class="line">'+esc(n)+'</div>').join(''):'<span class="muted">Brak nowych powiadomień</span>')+'</div>';break;
case 'store':h=head('AB Store')+'<div class="hero"><span class="brand">AB ORIGINALS</span><h2>Nowy świat aplikacji.</h2><p>Odkrywaj gry i narzędzia stworzone dla ASBONE.</p></div><div class="tabbar"><button class="soft" data-tab="all">Odkrywaj</button><button class="soft" data-tab="mine">Moje aplikacje</button></div><input class="search" id="storesearch" placeholder="Szukaj aplikacji"><div id="storelist" class="panel">'+(tab==='mine'?state.installed:['game','music','files','studio']).map(listing).join('')+'</div>';break;
case 'notes':h=head('Notatki')+'<p class="muted">Zapis automatyczny na tym urządzeniu</p><textarea id="note" placeholder="Twój pomysł…">'+esc(state.notes)+'</textarea><div style="margin-top:12px">'+action('Zapisz','data-act="savenote"')+'</div>';break;
case 'calc':h=head('Kalkulator')+'<div class="calcval">'+esc(calc)+'</div><div class="keys">'+['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','='].map(k=>'<button class="'+('÷×−+='.includes(k)?'op':'')+'" data-key="'+k+'" '+(k==='0'?'style="grid-column:span 2"':'')+'>'+k+'</button>').join('')+'</div>';break;
case 'photos':h=head('Galeria')+'<h3>Tapety ASBONE</h3><div class="grid2">'+walls.map((w,i)=>'<button class="wallpaper" style="background:'+w+'" data-wall="'+i+'" aria-label="Ustaw tapetę '+(i+1)+'"></button>').join('')+'</div><h3>Twoje zdjęcia</h3><div class="grid2">'+state.photos.map(p=>'<img style="width:100%;border-radius:16px" src="'+esc(p)+'" alt="Zdjęcie lokalne">').join('')+'</div><p class="muted">'+(state.photos.length?'':'Brak zdjęć. Otwórz Aparat, aby dodać zdjęcie.')+'</p>';break;
case 'camera':h=head('Aparat')+'<div class="camview"><div><div style="display:grid;place-items:center">'+icon('camera')+'</div><p class="muted">Wybierz zdjęcie z urządzenia<br>lub użyj aparatu, jeśli przeglądarka na to pozwala.</p></div></div><input type="file" accept="image/*" capture="environment" id="pickphoto" hidden><button class="shutter" data-act="pickphoto" aria-label="Dodaj zdjęcie"></button><div style="text-align:center"><button class="soft" data-go="photos">Galeria</button></div>';break;
case 'clock':h=head('Zegar')+'<div class="widget" style="text-align:center;padding:45px 15px"><div style="font-size:65px;font-weight:250;letter-spacing:-3px" id="appclock">'+time()+'</div><div style="text-transform:capitalize">'+date()+'</div></div><div class="panel"><div class="line">Strefa czasowa <b>'+esc(Intl.DateTimeFormat().resolvedOptions().timeZone)+'</b></div></div>';break;
case 'calendar':{let d=new Date(),start=(new Date(d.getFullYear(),d.getMonth(),1).getDay()+6)%7,days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();h=head('Kalendarz')+'<h2 style="text-transform:capitalize">'+d.toLocaleDateString('pl-PL',{month:'long',year:'numeric'})+'</h2><div class="panel calendar">'+['Pn','Wt','Śr','Cz','Pt','So','Nd'].map(s=>'<span class="muted">'+s+'</span>').join('')+Array(start).fill('<span></span>').join('')+Array.from({length:days},(_,i)=>'<span class="'+(i+1===d.getDate()?'today':'')+'">'+(i+1)+'</span>').join('')+'</div>';break}
case 'phone':h=head('Telefon')+'<div class="calcval" style="text-align:center;font-size:30px">'+esc(dial||'Wprowadź numer')+'</div><div class="dial">'+['1','2','3','4','5','6','7','8','9','*','0','#'].map(n=>'<button data-dial="'+n+'">'+n+'</button>').join('')+'</div><div class="row" style="margin:20px 0">'+action('Usuń','data-act="deldial"')+action('Połącz (demo)','data-act="call"')+'</div><p class="muted">Symulator nie wykonuje prawdziwych połączeń.</p>';break;
case 'chat':h=head('Wiadomości')+'<div class="panel"><b>AB System</b><p>Witaj w ASBONE One.</p><span class="muted">Wiadomość systemowa</span></div>'+state.messages.map(m=>'<div class="bubble">'+esc(m)+'</div>').join('')+'<input class="search" id="message" placeholder="Wiadomość testowa…">'+action('Wyślij lokalnie','data-act="send"')+'<p class="muted">Wiadomości pozostają w symulatorze.</p>';break;
case 'web':h=head('AB Web')+'<div style="display:grid;place-items:center;margin:28px">'+icon('web')+'</div><input class="search" id="query" placeholder="Szukaj aplikacji AB OS" value="'+esc(search)+'">'+action('Szukaj','data-act="search"')+'<p class="muted">Wyszukiwarka lokalnego katalogu AB. Nie jest pełną przeglądarką internetu.</p>'+(search?'<div class="panel">'+Object.keys(apps).filter(k=>apps[k][0].toLowerCase().includes(search.toLowerCase())).map(k=>'<div class="line">'+icon(k)+'<b>'+apps[k][0]+'</b>'+action('Otwórz','data-go="'+(['game','music','files','studio'].includes(k)&&!state.installed.includes(k)?'store':k)+'"')+'</div>').join('')+'</div>':'');break;
case 'ai':h=head('AB Intelligence')+'<div style="display:grid;place-items:center;margin:32px">'+icon('ai')+'</div><h2>Jak mogę pomóc?</h2><p class="muted">Asystent systemowy — tryb demonstracyjny.</p><div class="panel"><div class="line">Personalizacja'+action('Tapety','data-go="wallpaper"')+'</div><div class="line">Nowe gry'+action('AB Store','data-go="store"')+'</div><div class="line">Zapisz pomysł'+action('Notatki','data-go="notes"')+'</div></div>';break;
case 'game':h=head('Orbit Rush')+'<div class="row"><b>Wynik: '+score+'</b><span class="muted">Rekord: '+state.best+'</span></div><div class="game"><button class="orb" data-act="orb" style="left:'+pos[0]+'%;top:'+pos[1]+'%" aria-label="Złap kulę"></button></div>'+action('Nowa gra','data-act="resetgame"')+'<p class="muted">Dotykaj kuli, aby zdobywać punkty.</p>';break;
case 'music':h=head('AB Music')+'<div class="musicart">'+svg(icons.music)+'</div><h2>Twoja muzyka</h2><p class="muted">Wybierz własny plik audio. Nie przesyłamy go na serwer.</p><input type="file" accept="audio/*" id="audiofile" class="search"><audio id="player" controls style="width:100%"></audio>';break;
case 'files':h=head('Pliki')+'<div class="panel"><div class="line">Notatka AB'+action('Otwórz','data-go="notes"')+'</div><div class="line">Zdjęcia ('+state.photos.length+')'+action('Otwórz','data-go="photos"')+'</div></div><p class="muted">Pliki lokalne symulatora, nie pełna pamięć telefonu.</p>';break;
case 'studio':h=head('AB Studio')+'<div class="hero"><div class="brand">ASBONE ENTERTAINMENT</div><h2>Twórz własne uniwersum.</h2><p>Studio pomysłów na filmy i gry.</p></div>'+action('Zapisz pomysł','data-go="notes"');break;
}view.innerHTML=h;view.scrollTop=0}
function calculate(k){let n=Number(calc);if(k==='AC'){calc='0';operand=operator=null;fresh=false;return}if(k==='±'){calc=String(-n);return}if(k==='%'){calc=String(n/100);return}if(['+','−','×','÷','='].includes(k)){if(operand!==null&&!fresh){n=operator==='+'?operand+n:operator==='−'?operand-n:operator==='×'?operand*n:operand/n;calc=Number.isFinite(n)?String(Number(n.toPrecision(11))):'Błąd'}if(k==='='){operand=operator=null}else{operand=n;operator=k}fresh=true;return}if(fresh||calc==='Błąd'){calc='0';fresh=false}if(k==='.'&&calc.includes('.'))return;calc=k==='.'?calc+'.':calc==='0'?k:calc+k;calc=calc.slice(0,15)}
device.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.go){if(b.classList.contains('app'))launchRect=b.querySelector('.ico').getBoundingClientRect();go(d.go);return}if(d.page!==undefined){homePage=Number(d.page);render();view.querySelector('.apps')?.animate([{opacity:0,transform:'translateX(20px)'},{opacity:1,transform:'none'}],{duration:250,easing:'ease-out'});return}if(d.toggle){state[d.toggle]=!state[d.toggle];if(d.toggle==='wifi'&&state.wifi)state.air=false;if(d.toggle==='air'&&state.air)state.wifi=false;save();render();return}if(d.wall!==undefined){state.wall=+d.wall;save();render();toast('Tapeta ustawiona');return}if(d.install){if(installing||state.installed.includes(d.install))return;let id=d.install;installing=id;render();setTimeout(()=>{state.installed.push(id);installing=null;notify('Zainstalowano '+apps[id][0]);if(page==='store'||page==='home')render()},850);return}if(d.tab){tab=d.tab;render();return}if(d.key){calculate(d.key);render();return}if(d.dial){dial=(dial+d.dial).slice(0,18);render();return}switch(d.act){case 'clearrecent':recents=[];render();break;case 'closecontrol':go(prev==='control'?'home':prev);break;case 'update':toast('AB OS 2.0 — aktualna wersja prototypu');break;case 'clear':state.notifications=[];save();render();break;case 'savenote':save();toast('Notatka zapisana');break;case 'pickphoto':$('#pickphoto').click();break;case 'deldial':dial=dial.slice(0,-1);render();break;case 'call':toast('Połączenia niedostępne w symulatorze');break;case 'send':{let m=$('#message').value.trim();if(m){state.messages.push(m);save();render()}break}case 'search':search=$('#query').value.trim();render();break;case 'orb':score++;state.best=Math.max(score,state.best);pos=[4+Math.random()*70,4+Math.random()*72];save();render();break;case 'resetgame':score=0;render();break;}});
device.addEventListener('input',e=>{let el=e.target;if(el.id==='note'){state.notes=el.value;save()}if(el.id==='brightness'){state.brightness=+el.value;status();$('#brightval').textContent=el.value+'%';save()}if(el.id==='librarysearch'){let q=el.value.trim().toLowerCase();let ids=[...new Set([...primary,...dockIds,...state.installed])].filter(id=>apps[id][0].toLowerCase().includes(q));$('#librarylist').innerHTML=q?'<div class="apps" style="grid-column:1/-1">'+(ids.map(app).join('')||'<p>Brak wyników</p>')+'</div>':groups().map(([name,ids])=>'<section class="librarygroup"><div class="apps">'+ids.map(app).join('')+'</div><h3>'+name+'</h3></section>').join('')}if(el.id==='storesearch'){let q=el.value.toLowerCase();$('#storelist').innerHTML=(tab==='mine'?state.installed:['game','music','files','studio']).filter(id=>apps[id][0].toLowerCase().includes(q)).map(listing).join('')||'<p class="muted">Brak wyników</p>'}});
device.addEventListener('change',e=>{let f=e.target.files?.[0];if(!f)return;if(e.target.id==='audiofile'){let p=$('#player');p.src=URL.createObjectURL(f)}if(e.target.id==='pickphoto'){if(!f.type.startsWith('image/'))return;let url=URL.createObjectURL(f),img=new Image();img.onload=()=>{let c=document.createElement('canvas'),r=Math.min(1,720/Math.max(img.width,img.height));c.width=img.width*r;c.height=img.height*r;c.getContext('2d').drawImage(img,0,0,c.width,c.height);state.photos.push(c.toDataURL('image/jpeg',.72));state.photos=state.photos.slice(-10);URL.revokeObjectURL(url);save();go('photos');toast('Zdjęcie dodane do galerii')};img.src=url}});
let touch=null;let barHold=null;const bar=device.querySelector('.homebar');bar.addEventListener('pointerdown',()=>{barHold=setTimeout(()=>{barHold=null;go('recent');bar.dataset.held='1'},450)});['pointerup','pointercancel','pointerleave'].forEach(ev=>bar.addEventListener(ev,()=>{clearTimeout(barHold)}));bar.addEventListener('click',e=>{if(bar.dataset.held){e.stopPropagation();delete bar.dataset.held}},true);device.addEventListener('touchstart',e=>{touch={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});device.addEventListener('touchend',e=>{if(!touch)return;let dy=e.changedTouches[0].clientY-touch.y,dx=e.changedTouches[0].clientX-touch.x;if(page==='home'&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){let next=homePage+(dx<0?1:-1);if(next>1)go('library');else if(next>=0){homePage=next;render();view.querySelector('.apps')?.animate([{opacity:0,transform:'translateX('+(dx<0?35:-35)+'px)'},{opacity:1,transform:'none'}],{duration:260,easing:'cubic-bezier(.2,.75,.22,1)'})}}else if(Math.abs(dy)>65&&Math.abs(dy)>Math.abs(dx)*1.5){let rect=device.getBoundingClientRect();if(dy<0&&(page==='lock'||touch.y>rect.bottom-35))go('home');else if(dy>0&&touch.y<rect.top+65)go('control');else if(dy>0&&page==='home')go('library')}touch=null},{passive:true});setInterval(()=>{status();['widgettime','locktime','appclock'].forEach(id=>{let e=document.getElementById(id);if(e)e.textContent=time()})},15000);render();
</script></body></html>
