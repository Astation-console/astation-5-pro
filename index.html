step(dt,keys){if(!this.active||!this.s)return;dt=min(.033,dt);this.time+=dt;this.input(keys,dt);if(this.s){for(let p of this.s.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vy-=7*dt;p.life-=dt}this.s.particles=this.s.particles.filter(p=>p.life>0);this.cb.played(this.id,dt);if(this.time-this.lastHud>.15){this.lastHud=this.time;let s=this.s;if(this.id==='eclipse')this.cb.hud(`HP ${Math.max(0,Math.ceil(s.hp))} · STAGE ${s.stage}/3 · ${s.kills} KO`,s.bossActive?'ZERO GUARDIAN · '+Math.ceil(s.enemies.find(e=>e.boss)?.hp||0)+' HP':`ELIMINATE SENTINELS · ${s.waveKills}/${s.stage===1?4:s.stage===2?6:3}`);if(this.id==='velocity')this.cb.hud(`${Math.round(s.speed*3.6)} KM/H · LAP ${Math.min(3,s.lap)}/3`,`${Math.round(s.distance%860)} / 860 m · OVERTAKES ${s.passed}`);if(this.id==='astro')this.cb.hud(`WORLD ${s.stage}/3 · CRYSTALS ${s.coins}`,`REACH THE PORTAL · ${Math.round(abs(s.z-s.portalZ))}m`)}this.render()}}
}
window.AStation3D=AStation3D;
})();

function os3ExtraColor(id,index){const palette={eclipse:['#1c3560','#2079c7'],velocity:['#331351','#bd4d9a'],astro:['#176e9b','#80e9de'],signal:['#3d475a','#d7ac6b'],afterlight:['#193a34','#79ba92']}[id]||['#17416a','#6ab6ff'];let n=index-5;return `linear-gradient(${125+(n*17)}deg,${palette[0]},${palette[1]})`}
function checkOS3Achievements(id){if(!gameBy(id)||!session)return;const st=stat(id),s=session.is3d?engine3d?.s:session;if(!s)return;
let metric={eclipse:session.is3d?(s.totalKills||s.kills||0):(s.kills||0),velocity:session.is3d?(s.distance||0):(s.dist||0),astro:s.coins||0}[id]||0;
const checks={eclipse:[metric>=2,st.level>=2,metric>=4,st.played>=90,st.progress>=80],velocity:[metric>=250,metric>=1000,st.progress>=50,st.played>=90,st.progress>=90],astro:[metric>=3,metric>=5,st.level>=2,st.played>=90,st.progress>=80],signal:[st.progress>=20,st.level>=2,st.progress>=50,st.played>=90,st.level>=3],afterlight:[st.progress>=10,st.level>=2,st.progress>=50,st.played>=90,st.level>=3]}[id];if(checks)checks.forEach((ok,n)=>{if(ok)grant(id,n+5)})}

/* ASTATION OS 3.0 — core services. Bundled inside the existing app closure.
   This release deliberately does not fabricate online users, server downloads or unbuilt games. */
const OS3 = (()=>{
  const clone = value => JSON.parse(JSON.stringify(value,(k,v)=>v instanceof Set?{__astation_set:[...v]}:v),(k,v)=>v && Array.isArray(v.__astation_set)?new Set(v.__astation_set):v);
  const quickSlots = new Map();
  const NPCs=[
    {id:'nova',name:'Nova',avatar:'N',color:'#5f7cf7',game:'astro',status:'online'},
    {id:'byte',name:'Byte',avatar:'B',color:'#28b9bd',game:'eclipse',status:'online'},
    {id:'luna',name:'Luna',avatar:'L',color:'#c285ef',game:null,status:'away'},
    {id:'kai',name:'Kai',avatar:'K',color:'#f4a15c',game:'velocity',status:'offline'}
  ];
  for(const [key,val] of Object.entries({wishlist:[],favourites:[],party:{active:false,players:[],ready:[],game:'eclipse'},friends:[],captureCount:0,checkpoints:{},pinnedTrophy:null,preferences:{brightness:100,contrast:100,animation:100,uiScale:100,mode:'balanced',musicVolume:70,sfxVolume:80,navigationSounds:true,deadzone:15}})) {
    if(state[key]===undefined||state[key]===null)state[key]=clone(val);
  }
  const prefs=state.preferences;
  const systemLabel=(pl,en)=>state.lang==='pl'?pl:en;
  const doc=document;
  const $el=id=>doc.getElementById(id);
  const esc2=v=>escapeHTML(v);
  const newNote=(title,msg)=>toast(title,msg);
  const safeTime=t=>{try{return new Date(t).toLocaleString(state.lang==='pl'?'pl-PL':'en-GB')}catch{return ''}};
  const timeStr=(seconds)=>Math.round(seconds/60)+' min';
  const getShotDb=()=>new Promise((res,rej)=>{
    if(!indexedDB)return rej(Error('IndexedDB unavailable'));
    const req=indexedDB.open('ASTATION_OS3_MEDIA',1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('captures'))db.createObjectStore('captures',{keyPath:'id'})};
    req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error||Error('Database unavailable'));
  });
  async function dbWrite(value){let db=await getShotDb();return new Promise((resolve,reject)=>{let tx=db.transaction('captures','readwrite');tx.objectStore('captures').put(value);tx.oncomplete=()=>{db.close();resolve(value)};tx.onerror=()=>{db.close();reject(tx.error)}})}
  async function dbList(){let db=await getShotDb();return new Promise((resolve,reject)=>{let tx=db.transaction('captures','readonly'),r=tx.objectStore('captures').getAll();r.onsuccess=()=>{db.close();resolve(r.result||[])};r.onerror=()=>{db.close();reject(r.error)}})}
  async function dbDelete(id){let db=await getShotDb();return new Promise((resolve,reject)=>{let tx=db.transaction('captures','readwrite');tx.objectStore('captures').delete(id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
  let imageUrls=[];
  const clearUrls=()=>{imageUrls.forEach(url=>URL.revokeObjectURL(url));imageUrls=[]};
  async function gallery(){const box=$el('os-gallery-items');if(!box)return;box.textContent=systemLabel('Odczytywanie galerii...','Loading gallery...');try{const items=(await dbList()).sort((a,b)=>b.id-a.id);if(!items.length){box.innerHTML='<p class="muted">'+systemLabel('Nie masz jeszcze zrzutów. Zrób zdjęcie przyciskiem w grze.','No screenshots yet. Capture one from a game.')+'</p>';return}clearUrls();box.innerHTML=items.map(entry=>{const url=URL.createObjectURL(entry.blob);imageUrls.push(url);return `<div class="os-shot"><img src="${url}" alt="${esc2(entry.game)}" loading="lazy"><div class="os-shot-row"><span>${esc2(entry.game)} · ${safeTime(entry.id)}</span><div><button class="tiny" data-os="view-shot" data-id="${entry.id}">${systemLabel('Zobacz','View')}</button><button class="tiny" data-os="export-shot" data-id="${entry.id}">${systemLabel('Eksport','Export')}</button><button class="tiny" data-os="delete-shot" data-id="${entry.id}">${systemLabel('Usuń','Delete')}</button></div></div></div>`}).join('');}catch(err){box.innerHTML='<p class="muted">'+systemLabel('Galeria wymaga IndexedDB w przeglądarce.','Gallery needs IndexedDB support.')+'</p>';console.warn(err)}}
  async function capture(){if(!session){newNote('ASTATION Capture',systemLabel('Uruchom grę, aby zrobić zrzut.','Launch a game to capture.'));return}try{
    let source=session.is3d?$el('canvas3d'):$el('canvas');let snapshot=document.createElement('canvas');snapshot.width=source.width;snapshot.height=source.height;
    let ctx=snapshot.getContext('2d');if(session.is3d && engine3d?.gl){engine3d.render();let gl=engine3d.gl;let w=source.width,h=source.height;let pixels=new Uint8Array(w*h*4);gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,pixels);let data=ctx.createImageData(w,h);for(let y=0;y<h;y++){let from=(h-y-1)*w*4,to=y*w*4;data.data.set(pixels.subarray(from,from+w*4),to)}ctx.putImageData(data,0,0)}else ctx.drawImage(source,0,0);
    const blob=await new Promise((resolve,reject)=>snapshot.toBlob(b=>b?resolve(b):reject(Error('Capture unavailable')),'image/webp',.82));
    const entry={id:Date.now(),game:gameBy(session.id)?.title||session.id,blob};await dbWrite(entry);state.captureCount=(state.captureCount||0)+1;save();newNote('ASTATION Capture',systemLabel('Zapisano zdjęcie w galerii.','Screenshot saved to gallery.'));systemSfx('complete');
  }catch(err){console.warn('Capture failed',err);newNote('ASTATION Capture',systemLabel('Nie udało się zapisać zdjęcia na tym urządzeniu.','Capture unavailable on this device.'))}}
  async function captureAction(action,id){const n=Number(id);let items=await dbList();let found=items.find(x=>x.id===n);if(!found)return;const url=URL.createObjectURL(found.blob);if(action==='delete-shot'){URL.revokeObjectURL(url);await dbDelete(n);gallery();return}if(action==='export-shot'){const a=document.createElement('a');a.href=url;a.download='astation-'+n+'.webp';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);return}let overlay=document.createElement('div');overlay.className='os-lightbox';overlay.innerHTML=`<button class="os-lightbox-close" data-os="close-shot">✕</button><img alt="ASTATION Capture" src="${url}">`;overlay.addEventListener('click',e=>{if(e.target===overlay || e.target.closest('[data-os="close-shot"]')){overlay.remove();URL.revokeObjectURL(url)}});$el('root').append(overlay)}
  function saveSnapshot(){if(!session || gameEnded || !sessionStarted)return;try{
    const slot={id:session.id,time:Date.now(),is3d:!!session.is3d,session:clone(session),engine:session.is3d && engine3d?.s?clone(engine3d.s):null,engineTime:engine3d?.time||0};quickSlots.set(session.id,slot);state.checkpoints[session.id]=session.is3d?{id:session.id,time:slot.time,is3d:true,lastCheckpoint:true,session:{id:session.id,is3d:true},engine:null}:slot;const encoded=JSON.stringify(state.checkpoints[session.id]);if(encoded.length>250000)delete state.checkpoints[session.id];save();
  }catch(err){console.warn('Snapshot unavailable',err)}}
  function slotFor(id){return quickSlots.get(id)||state.checkpoints?.[id]||null}
  function restore(id){let slot=slotFor(id);if(!slot)return false;try{
    if(slot.session?.id!==id)return false;
    if(!!session.is3d!==!!slot.is3d){return false}if(slot.lastCheckpoint){return false}
    session=clone(slot.session);if(session.is3d&&engine3d && slot.engine){engine3d.s=clone(slot.engine);engine3d.active=true;engine3d.id=id;engine3d.time=slot.engineTime||0;engine3d.level=engine3d.s.stage||1;engine3d.render()}
    return true;
  }catch(err){console.warn('Restore failed, checkpoint fallback',err);return false}}
  function exportSave(){const file=new Blob([JSON.stringify({format:'ASTATION_OS3_SAVE',version:3,date:new Date().toISOString(),data:state},null,2)],{type:'application/json'});const u=URL.createObjectURL(file);const a=document.createElement('a');a.href=u;a.download='astation-os3-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
  function importSave(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(String(reader.result));if(parsed.format!=='ASTATION_OS3_SAVE'||!parsed.data||!Array.isArray(parsed.data.installed)||typeof parsed.data.trophies!=='object')throw Error('Invalid save format');if(JSON.stringify(parsed.data).length>1500000)throw Error('Save too large');localStorage.setItem('astation_pro_v2_backup',localStorage.getItem('astation_pro_v2')||'{}');localStorage.setItem('astation_pro_v2',JSON.stringify(parsed.data));location.reload()}catch(e){newNote('ASTATION',systemLabel('Nieprawidłowy plik zapisu.','Invalid save file.'))}};reader.readAsText(file)}
  function userSaveClear(id){if(!gameBy(id))return;delete state.stats[id];delete state.trophies[id];state.history=state.history.filter(x=>x.id!==id);delete state.checkpoints[id];quickSlots.delete(id);save();newNote('ASTATION Save',systemLabel('Dane gry zostały usunięte.','Game progress deleted.'));renderPanel()}
  function htmlFriends(){const active=NPCs.filter(n=>state.friends.includes(n.id));return `<div class="os-hero-card"><div class="eyebrow">ASTATION NETWORK · LOCAL DEMO</div><h3>${systemLabel('Znajomi','Friends')}</h3><p class="muted">${systemLabel('To są fikcyjne profile NPC. Nie ma połączenia z rzeczywistą siecią znajomych.','These are fictional NPC profiles; no real friend network is connected.')}</p></div><div class="os-cards">${NPCs.map(n=>`<div class="os-friend"><span class="os-friend-avatar" style="background:${n.color}">${n.avatar}</span><div style="flex:1"><b>${n.name}</b><small>${n.status.toUpperCase()} · ${n.game?gameBy(n.game)?.title:'—'}</small></div><button class="tiny" data-os="friend-toggle" data-id="${n.id}">${state.friends.includes(n.id)?systemLabel('Usuń','Remove'):systemLabel('Dodaj','Add')}</button><button class="tiny" data-os="friend-invite" data-id="${n.id}">${systemLabel('Zaproś','Invite')}</button></div>`).join('')}</div><div class="os-footnote">${systemLabel('Zaproszenia są symulacją lokalną. Multiplayer online będzie wymagał serwera.','Invitations are local simulations. Online multiplayer needs a server.')}</div>`}
  function htmlParty(){const party=state.party;const members=party.active?['you',...party.players]:[];return `<div class="os-hero-card"><div class="eyebrow">ASTATION PARTIES · OFFLINE SIMULATOR</div><h3>${systemLabel('Impreza graczy','Party')}</h3><p class="muted">${systemLabel('Lokalny symulator grupy z fikcyjnymi znajomymi. Bez rozmowy głosowej i multiplayera.','A local party simulator with fictional friends, not voice chat or multiplayer.')}</p><div class="os-btnrow">${party.active?`<button class="secondary" data-os="party-leave">${systemLabel('Opuść imprezę','Leave party')}</button>`:`<button class="cta" data-os="party-create">${systemLabel('Stwórz imprezę','Create party')}</button>`}</div></div>${party.active?`<div class="box-card"><h3>${systemLabel('Uczestnicy','Members')} (${members.length}/5)</h3>${members.map(id=>{let npc=NPCs.find(n=>n.id===id),ready=party.ready.includes(id);return `<div class="os-friend"><span class="os-friend-avatar" style="background:${npc?.color||'#2771c4'}">${npc?.avatar||'A'}</span><div style="flex:1"><b>${npc?.name||esc2(state.name)}</b><small>${ready?systemLabel('Gotowy','Ready'):systemLabel('Nie gotowy','Not ready')}</small></div>${id==='you'?`<button class="tiny" data-os="party-ready">${ready?systemLabel('Cofnij gotowość','Unready'):systemLabel('Gotowy','Ready')}</button>`:`<button class="tiny" data-os="party-kick" data-id="${id}">${systemLabel('Usuń','Remove')}</button>`}</div>`}).join('')}<label class="field">${systemLabel('Wybrana gra','Selected game')}<select id="party-game">${games.map(g=>`<option value="${g.id}" ${g.id===party.game?'selected':''}>${g.title} ${g.subtitle}</option>`).join('')}</select></label><div class="os-footnote">${systemLabel('Tylko gry na tym urządzeniu. Każdy gracz NPC jest gotowy automatycznie po zaproszeniu.','Games run on this device only. NPC members auto-ready when invited.')}</div></div><h3>${systemLabel('Zaproś NPC','Invite NPCs')}</h3><div class="os-cards">${NPCs.filter(n=>!party.players.includes(n.id)).map(n=>`<div class="os-friend"><span class="os-friend-avatar" style="background:${n.color}">${n.avatar}</span><b style="flex:1">${n.name}</b><button class="tiny" data-os="party-invite" data-id="${n.id}">${systemLabel('Zaproś','Invite')}</button></div>`).join('')}</div>`:''}`}
  function htmlStorage(){const used=games.reduce((x,g)=>x+(state.installed.includes(g.id)?g.size:0),0),free=Math.max(0,825-used);return `<div class="os-hero-card"><div class="eyebrow">ASTATION SSD · 825 GB</div><h3>${used.toFixed(1)} GB ${systemLabel('zajęte','used')}</h3><p>${free.toFixed(1)} GB ${systemLabel('dostępne','available')}</p><div class="os-disk"><div style="width:${Math.max(.2,used/825*100)}%"></div></div></div><div class="box-card"><h3>${systemLabel('Gry i aplikacje','Games and apps')}</h3>${state.installed.map(id=>{let g=gameBy(id);return g?`<div class="list-row"><div class="row-main"><b>${g.title}</b><small>${g.size} GB · ${systemLabel('Zapis zostanie zachowany po odinstalowaniu','Progress is kept on uninstall')}</small></div><button class="tiny" data-action="removeGame" data-id="${id}">${systemLabel('Odinstaluj','Uninstall')}</button><button class="tiny" data-os="clear-save-prompt" data-id="${id}">${systemLabel('Usuń zapis','Delete save')}</button></div>`:''}).join('')||'<p class="muted">'+systemLabel('Brak gier','No installed games')+'</p>'}</div><div class="box-card"><h3>ASTATION DATA</h3><p class="muted">${systemLabel('Dane zapisów pozostają lokalne na urządzeniu. Multimedia są przechowywane osobno w IndexedDB.','Game saves stay on this device. Media is stored separately in IndexedDB.')}</p><div class="os-btnrow"><button class="secondary" data-os="export-save">${systemLabel('Eksportuj zapis','Export save')}</button><button class="secondary" data-os="import-save">${systemLabel('Importuj zapis','Import save')}</button><button class="secondary" data-action="gallery">${systemLabel('Galeria','Gallery')}</button></div><input type="file" id="os-save-file" accept="application/json,.json" style="display:none"></div>`}
  function htmlCapture(){return `<div class="os-hero-card"><div class="eyebrow">ASTATION CAPTURE</div><h3>${systemLabel('Galeria multimediów','Capture gallery')}</h3><p class="muted">${systemLabel('Zrzuty są zapisywane lokalnie w IndexedDB. Naciśnij przycisk aparatu podczas gry.','Screenshots are stored in IndexedDB. Use the camera button during gameplay.')}</p></div><div id="os-gallery-items" class="os-cards"></div>`}
  function htmlSettingsExtra(){const p=state.preferences;const range=(key,label,min,max,unit='%',step=1)=>`<label class="field">${label} <strong id="os-value-${key}">${p[key]}${unit}</strong><input type="range" data-os-range="${key}" min="${min}" max="${max}" step="${step}" value="${p[key]}"></label>`;return `<div class="os-subsettings box-card"><h3>${systemLabel('Obraz i wydajność','Display & performance')}</h3>${range('brightness',systemLabel('Jasność','Brightness'),50,135)}${range('contrast',systemLabel('Kontrast','Contrast'),70,135)}${range('animation',systemLabel('Intensywność animacji','Animation intensity'),0,100)}${range('uiScale',systemLabel('Skala UI','UI scale'),80,120)}<label class="field">${systemLabel('Tryb obrazu','Graphics preset')}<select data-os-select="mode"><option value="balanced" ${p.mode==='balanced'?'selected':''}>Balanced</option><option value="performance" ${p.mode==='performance'?'selected':''}>Performance</option><option value="quality" ${p.mode==='quality'?'selected':''}>Quality</option></select></label><h3>${systemLabel('Audio i sterowanie','Audio & controls')}</h3>${range('musicVolume',systemLabel('Głośność muzyki','Music volume'),0,100)}${range('sfxVolume',systemLabel('Głośność efektów','SFX volume'),0,100)}${range('deadzone',systemLabel('Martwa strefa pada','Gamepad deadzone'),5,40)}<label class="field"><input type="checkbox" data-os-checkbox="navigationSounds" ${p.navigationSounds?'checked':''}> ${systemLabel('Dźwięki nawigacji','Navigation sounds')}</label><div class="os-btnrow"><button class="secondary" data-action="controller">${systemLabel('Test kontrolera','Controller test')}</button><button class="secondary" data-os="reset-all-settings">${systemLabel('Przywróć ustawienia systemowe','Restore system settings')}</button><button class="secondary" data-os="export-save">${systemLabel('Eksportuj zapis','Export save')}</button></div><div class="muted">ASTATION OS 3.0 · Browser simulator</div></div>`}
  function htmlController(){return `<div class="os-hero-card"><h3>${systemLabel('Tester kontrolera','Controller tester')}</h3><p class="muted">${systemLabel('Podłącz pada i naciśnij przycisk. Działanie zależy od przeglądarki.','Connect a gamepad and press a button. Browser support varies.')}</p></div><div class="box-card" id="os-gamepad-tester" aria-live="polite"></div>`}
  function htmlAchievements(){const earned=games.reduce((n,g)=>n+(state.trophies[g.id]?.length||0),0),next=earned%4;return `<div class="os-hero-card"><div class="eyebrow">ASTATION TROPHIES 3.0</div><h3>${systemLabel('Poziom gracza','Player level')} ${1+Math.floor(earned/4)}</h3><div class="os-disk"><div style="width:${next/4*100}%"></div></div><p class="muted">${4-next} ${systemLabel('do następnego poziomu','until next level')} · ${earned}/${trophyTotal()} ${systemLabel('trofeów','trophies')}</p></div><div class="os-featured-trophy"><h3>${systemLabel('Przypięte trofeum','Pinned trophy')}</h3>${state.pinnedTrophy?`${trophyArt(state.pinnedTrophy.id,state.pinnedTrophy.index,false)} <b>${esc2(gameBy(state.pinnedTrophy.id)?.title||'')}</b><button class="tiny" data-os="unpin-trophy">${systemLabel('Odepnij','Unpin')}</button>`:'<p class="muted">'+systemLabel('Przypnij trofeum z listy osiągnięć.','Pin a trophy from your achievements list.')+'</p>'}</div>`}
  function htmlRecentTrophies(){return `<h3>${systemLabel('Ostatnie trofea','Recent trophies')}</h3>`+state.history.slice(0,15).map(h=>`<div class="os-friend">${trophyArt(h.id,h.index,false)}<div style="flex:1"><b>${esc2(state.lang==='pl'?trophyMeta(gameBy(h.id),h.index)?.[1]||'Platyna':trophyMeta(gameBy(h.id),h.index)?.[0]||'Platinum')}</b><small>${esc2(gameBy(h.id)?.title||'')} · ${safeTime(h.time)}</small></div><button class="tiny" data-os="pin-trophy" data-id="${h.id}:${h.index}">${systemLabel('Przypnij','Pin')}</button></div>`).join('')}

  function htmlGameHub(id){const g=gameBy(id),pr=stat(id),n=(state.trophies[id]||[]).length;return `<div class="os-hero-card"><div class="eyebrow">ASTATION GAME HUB · ${esc2(tr(g.genre))}</div><h3>${esc2(g.title)} ${esc2(g.subtitle)}</h3><p>${esc2(tr(g.desc))}</p><div class="os-btnrow"><button class="cta" data-action="launch" data-id="${id}">${T('play')}</button><button class="secondary" data-action="activity" data-id="${id}">${T('activity')}</button><button class="secondary" data-action="detail" data-id="${id}">${T('details')}</button><button class="secondary" data-os="wishlist" data-id="${id}">${state.wishlist.includes(id)?systemLabel('Usuń z listy życzeń','Remove wishlist'):systemLabel('Lista życzeń','Wishlist')}</button></div></div><div class="os-hub-grid"><div class="box-card"><h3>${T('progress')} ${Math.round(pr.progress||0)}%</h3><div class="track"><i style="width:${Math.round(pr.progress||0)}%"></i></div><p>${T('played')}: ${timeStr(pr.played||0)}</p><p>${T('trophies')}: ${n}/10</p><p>Checkpoint: ${pr.level||1}</p></div><div class="box-card"><h3>${systemLabel('Wznowienie','Quick resume')}</h3><p class="muted">${slotFor(id)?systemLabel('Zapis sesji jest dostępny.','Session snapshot available.'):systemLabel('Gra wystartuje od punktu kontrolnego.','Game starts from its checkpoint.')}</p><button class="secondary" data-action="launch" data-id="${id}">${systemLabel('Otwórz grę','Open game')}</button></div></div><h3>ASTATION CAPTURE · ${T('details')}</h3><div class="gameplay-shots">${gameplayShots[id].map(src=>`<img src="${src}" alt="Screenshot ${esc2(g.title)}">`).join('')}</div>`}
  function render(panel,id){if(panel==='friends')return wrapPanel(systemLabel('Znajomi','Friends'),'ASTATION NETWORK · LOCAL',htmlFriends());if(panel==='party')return wrapPanel('ASTATION Parties','LOCAL PARTY DEMO',htmlParty());if(panel==='storage')return wrapPanel(T('storage'),'825 GB VIRTUAL SSD',htmlStorage());if(panel==='gallery'){setTimeout(gallery,0);return wrapPanel(systemLabel('Galeria','Gallery'),'ASTATION CAPTURE',htmlCapture())}if(panel==='controller'){setTimeout(updatePad,0);return wrapPanel(systemLabel('Kontrolery','Controllers'),'GAMEPAD API',htmlController())}if(panel==='wishlist')return wrapPanel(systemLabel('Lista życzeń','Wishlist'),'ASTATION STORE',htmlWish());if(panel==='hub' && gameBy(id))return wrapPanel('ASTATION GAME HUB',gameBy(id).title,htmlGameHub(id));return null}
  function decorateSettings(){const panel=$el('panel');if(!panel||currentPanel!=='settings')return;panel.insertAdjacentHTML('beforeend',htmlSettingsExtra())}
  function enrichTrophyPanel(){let panel=$el('panel');if(!panel||currentPanel!=='trophies')return;panel.insertAdjacentHTML('afterbegin',htmlAchievements()+htmlRecentTrophies())}
  function enrichProfile(){let panel=$el('panel');if(!panel||currentPanel!=='profile')return;panel.insertAdjacentHTML('beforeend',`<div class="os-profile-extras"><h3>${systemLabel('Ulubione gry','Favourite games')}</h3><div class="os-btnrow">${games.map(g=>`<button class="tiny ${state.favourites.includes(g.id)?'os-selected':''}" data-os="fav-game" data-id="${g.id}">${esc2(g.title)}</button>`).join('')}</div><h3>${systemLabel('Wybrane osiągnięcia','Featured achievements')}</h3>${state.history.slice(-3).reverse().map(h=>`<div class="os-friend">${trophyArt(h.id,h.index,false)}<b>${esc2(gameBy(h.id)?.title||'')}</b></div>`).join('')||'<p class="muted">'+systemLabel('Brak osiągnięć','No achievements')+'</p>'}<div class="os-featured-trophy"><h3>${systemLabel('Przypięte do profilu','Pinned to profile')}</h3>${state.pinnedTrophy?trophyArt(state.pinnedTrophy.id,state.pinnedTrophy.index,false)+' '+esc2(gameBy(state.pinnedTrophy.id)?.title||''):'<p class="muted">'+systemLabel('Wybierz zdobyte trofeum w zakładce Trofea.','Pin an earned trophy in the Trophies tab.')+'</p>'}</div><h3>${systemLabel('Poziom trofeów','Trophy level')} ${1+Math.floor(state.history.length/4)}</h3><div class="os-disk"><div style="width:${(state.history.length%4)/4*100}%"></div></div><div class="os-btnrow"><button class="secondary" data-os="export-save">${systemLabel('Eksport zapisu','Export save')}</button><button class="secondary" data-os="import-save">${systemLabel('Import zapisu','Import save')}</button><button class="secondary" data-action="wishlist">${systemLabel('Lista życzeń','Wishlist')}</button></div><input type="file" id="os-save-file" accept=".json,application/json" hidden></div>`)}
  function updatePad(){if(currentPanel!=='controller')return;const node=$el('os-gamepad-tester');if(!node)return;const pads=navigator.getGamepads?.()||[],gp=Array.from(pads).find(Boolean);if(!gp){node.innerHTML=`<p>${systemLabel('Nie wykryto kontrolera.','No connected controller detected.')}</p>`;return}node.innerHTML=`<h3>${esc2(gp.id).slice(0,140)}</h3><div class="os-pad-buttons">${gp.buttons.map((b,i)=>`<span class="os-pad-key ${b.pressed?'down':''}">${i}</span>`).join('')}</div><p class="muted">AXES: ${gp.axes.map(x=>Number(x).toFixed(2)).join(' · ')}</p><p class="muted">${systemLabel('Wibracje i przycisk PS zależą od przeglądarki.','Vibration and PS button depend on the browser.')}</p>`}
  let updatePadInterval=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)saveSnapshot()});
  function init(){const nav=doc.querySelector('#console .navigation');if(nav && !nav.querySelector('.os-menu-more')){const wrap=doc.createElement('div');wrap.className='os-menu-more';wrap.innerHTML=`<button class="os-more-button" data-action="friends" title="Friends">${svgIcon('profile',19)}<span>Friends</span></button><button class="os-more-button" data-action="party" title="Parties">${svgIcon('library',19)}<span>Parties</span></button><button class="os-more-button" data-action="gallery" title="Gallery">${svgIcon('play',19)}<span>Gallery</span></button>`;nav.insertBefore(wrap,nav.querySelector('.nav-spacer')||null)}
    const gameHead=doc.querySelector('#game-overlay .head-controls');if(gameHead&&!doc.getElementById('os-capture-game')){const b=doc.createElement('button');b.id='os-capture-game';b.className='tiny';b.textContent='◉ Capture';b.setAttribute('data-os','capture');gameHead.insertBefore(b,gameHead.firstChild)}
    if(!doc.getElementById('os-save-file-global')){let inp=doc.createElement('input');inp.type='file';inp.id='os-save-file-global';inp.accept='.json,application/json';inp.hidden=true;doc.getElementById('root').append(inp);inp.onchange=e=>importSave(e.target.files?.[0])}
    document.addEventListener('keydown',e=>{if(e.key==='F8'&&session){e.preventDefault();capture()}});
    doc.getElementById('root').addEventListener('click',e=>{let t=e.target.closest('[data-os]');if(t){e.preventDefault();e.stopPropagation();action(t.dataset.os,t.dataset.id)}});
    doc.getElementById('panel').addEventListener('input',e=>{let k=e.target.dataset.osRange;if(k&&Object.hasOwn(prefs,k)){prefs[k]=+e.target.value;$el('os-value-'+k).textContent=prefs[k]+'%';applyPrefs();save()}});
    doc.getElementById('panel').addEventListener('change',e=>{if(e.target.dataset.osSelect==='mode'){prefs.mode=e.target.value;applyPrefs();save()}if(e.target.dataset.osCheckbox==='navigationSounds'){prefs.navigationSounds=e.target.checked;save()}if(e.target.id==='party-game'){state.party.game=e.target.value;save()}});
    applyPrefs();updatePadInterval=setInterval(updatePad,250);
    window.addEventListener('pagehide',()=>{saveSnapshot();save()});
  }
  function applyPrefs(){const p=state.preferences;const root=$el('root');if(!root)return;root.style.setProperty('--os-ui-scale',p.uiScale/100);root.style.setProperty('--os-anim',p.animation/100);root.style.setProperty('--os-brightness',p.brightness/100);root.style.setProperty('--os-contrast',p.contrast/100);window.__asQualityRatio=p.mode==='performance'?1:p.mode==='quality'?2:1.4;}
  async function action(kind,id){let party=state.party;switch(kind){
    case 'capture':return capture();case 'view-shot':case 'export-shot':case 'delete-shot':return captureAction(kind,id);
    case 'wishlist':state.wishlist=state.wishlist.includes(id)?state.wishlist.filter(x=>x!==id):[...state.wishlist,id];save();renderPanel();return;
    case 'fav-game':state.favourites=state.favourites.includes(id)?state.favourites.filter(x=>x!==id):[...state.favourites,id];save();renderPanel();return;
    case 'friend-toggle':state.friends=state.friends.includes(id)?state.friends.filter(x=>x!==id):[...state.friends,id];save();renderPanel();return;
    case 'friend-invite':if(!state.friends.includes(id))state.friends.push(id);newNote('ASTATION Friends',systemLabel('Zaproszenie NPC wysłane lokalnie.','NPC invite simulated locally.'));save();return;
    case 'party-create':party.active=true;party.players=[];party.ready=[];save();renderPanel();newNote('ASTATION Parties',systemLabel('Impreza utworzona lokalnie.','Local party created.'));return;
    case 'party-leave':party.active=false;party.players=[];party.ready=[];save();renderPanel();return;
    case 'party-ready':party.ready=party.ready.includes('you')?party.ready.filter(x=>x!=='you'):[...party.ready,'you'];save();renderPanel();return;
    case 'party-invite':if(party.active&&!party.players.includes(id)&&party.players.length<4){party.players.push(id);party.ready.push(id);newNote('ASTATION Parties',`${NPCs.find(n=>n.id===id)?.name||id} ${systemLabel('dołączył do symulacji','joined simulation')}`)}save();renderPanel();return;
    case 'party-kick':party.players=party.players.filter(x=>x!==id);party.ready=party.ready.filter(x=>x!==id);save();renderPanel();return;
    case 'clear-save-prompt':if(confirm(systemLabel('Usunąć zapis, statystyki i trofea tej gry?','Delete save, statistics and trophies for this game?')))userSaveClear(id);return;
    case 'export-save':return exportSave();case 'import-save':return $el('os-save-file-global').click();
    case 'fullscreen':try{let root=$el('root');if(!document.fullscreenElement)await root.requestFullscreen?.();else await document.exitFullscreen?.()}catch(e){newNote('ASTATION',systemLabel('Pełny ekran nie jest dostępny w tej przeglądarce.','Fullscreen is unavailable in this browser.'))}return;
    case 'reset-prefs':Object.assign(state.preferences,{brightness:100,contrast:100,animation:100,uiScale:100,mode:'balanced',musicVolume:70,sfxVolume:80,navigationSounds:true,deadzone:15});applyPrefs();save();renderPanel();return;
    case 'reset-all-settings':if(!confirm(systemLabel('Przywrócić ustawienia domyślne? Zapisy gier pozostaną.','Restore default settings? Saves remain intact.')))return;state.lang='pl';state.theme='midnight';state.volume=65;state.musicEnabled=true;state.touchShown=true;Object.assign(state.preferences,{brightness:100,contrast:100,animation:100,uiScale:100,mode:'balanced',musicVolume:70,sfxVolume:80,navigationSounds:true,deadzone:15});applyPrefs();music(true);save();renderHome();renderPanel();return;
    case 'clear-notes':state.notifications=[];save();renderPanel();return;
    case 'delete-note':state.notifications.splice(Number(id),1);save();renderPanel();return;
    case 'pin-trophy':{const [tid,i]=id.split(':');if(!state.trophies[tid]?.includes(Number(i)))return;state.pinnedTrophy={id:tid,index:Number(i)};save();renderPanel();return}
    case 'unpin-trophy':state.pinnedTrophy=null;save();renderPanel();return;
  }}
  function handleActionRoute(kind,id){if(['friends','party','storage','gallery','controller','wishlist'].includes(kind)){showPanel(kind);return true}if(kind==='hub'){showPanel('hub',id||selected);return true}return false}
  return {init,action,render,decorateSettings,enrichTrophyPanel,enrichProfile,handleActionRoute,slotFor,saveSnapshot,restore,capture,exportSave,importSave,applyPrefs,NPCs,renderGallery:gallery,renderTrophy:htmlAchievements,quickSlots,clone};
})();

requestAnimationFrame(frame);refreshAvatar();OS3.init();boot();
})();
</script></body></html>
