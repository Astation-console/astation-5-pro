function frame(now){requestAnimationFrame(frame);let dt=Math.min(.035,Math.max(0,(now-(frame.last||now))/1000));frame.last=now;if(!session||gamePaused)return;pollGamepad();if(!session)return;let s=session;gameTime+=dt;gameSaveAt+=dt;let stats=stat(s.id);stats.played=(stats.played||0)+dt;if(gameSaveAt>4){gameSaveAt=0;save()}try{if(s.id==='eclipse'){updateEclipse(s,dt);drawEclipse(s)}if(s.id==='velocity'){updateVelocity(s,dt);drawVelocity(s)}if(s.id==='astro'){updateAstro(s,dt);drawAstro(s)}if(s.id==='signal'){updateSignal(s,dt);drawSignal(s)}if(s.id==='afterlight'){updateAfterlight(s,dt);drawAfterlight(s)}$('#game-hud').textContent=gameInfo;$('#game-objective').textContent=gameObjective;oldKeys={...keys}}catch(err){console.error(err);pauseGame(true);$('#pause-overlay').innerHTML=`<h2>Game paused</h2><p>Something went wrong.</p><button class="cta" data-game-action="retry">${T('retry')}</button>`}}
requestAnimationFrame(frame);refreshAvatar();boot();
})();
</script></body></html>
