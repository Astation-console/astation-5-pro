<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dreambound · Valley Run</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#13382c;color:#f1f7ec;font:600 15px/1.35 system-ui,sans-serif}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;inset:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:clamp(12px,2.5vw,28px);text-shadow:0 2px 8px #000}.hud b,.hud span{display:block}.hud span{font-size:12px;color:#d8eabf;letter-spacing:.09em}.hud strong{background:#0c271fd9;border:1px solid #a6d78e66;padding:8px 14px;border-radius:14px}.help{position:absolute;bottom:10px;text-align:center;width:100%;text-shadow:0 2px 4px #000;background:#122b2370;padding:5px}.panel{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;background:#08191dc9;text-align:center;padding:20px}.panel h1{font-size:clamp(26px,5vw,55px);margin:.2em}.panel button,.touch button{border:1px solid #d2efd78c;color:#f7fff6;border-radius:9px;padding:10px 16px;background:#163e32;font:inherit}.panel button{margin:3px}.touch{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:15px;right:15px;display:none;justify-content:space-between;pointer-events:none}.touch button{min-width:49px;min-height:44px;touch-action:none;pointer-events:auto;background:#122d24b8}.touch button:active{background:#729a50}[hidden]{display:none!important}@media(pointer:coarse){.touch{display:flex}.help{display:none}}
</style></head><body><canvas id="scene"></canvas><div class="hud"><div><span id="edition"></span><b id="level"></b></div><strong id="count"></strong></div><div id="help" class="help"></div><div class="touch"><div><button data-move="-1" aria-label="Left">◀</button> <button data-move="1" aria-label="Right">▶</button></div><button id="jump">Jump</button></div><div id="overlay" class="panel" hidden><h1 id="message"></h1><p id="detail"></p><div><button id="again"></button><button id="exit"></button></div></div><script type="module" src="./dreambound-lite.js"></script></body></html>
