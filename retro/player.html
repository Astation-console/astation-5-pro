<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ASTATION RETRO — DS Core</title>
<style>html,body{height:100%;margin:0;background:#030a15;overflow:hidden;color:#ddeeff;font-family:system-ui}#game{height:100%;width:100%;min-height:0;contain:layout paint size}#game canvas{image-rendering:auto}#waiting{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;background:linear-gradient(120deg,#08152d,#0b1c35)}#waiting small{color:#8eaac9;display:block;margin-top:12px;font-size:13px}.hide{display:none!important}</style></head><body>
<div id="game" aria-label="Silnik emulacji Nintendo DS"></div><div id="waiting"><div><b>ASTATION RETRO</b><small>Wczytywanie rdzenia Nintendo DS…</small></div></div>
<script src="./smart-performance.js?v=90"></script>
<script>
'use strict';
let launched=false;
let startupTimer=0, gameStarted=false;
let smart=null,paused=false,padChord=false,padTimer=0;
function checkPadShortcut(){
 if(!gameStarted||document.hidden)return;
 let pad;try{pad=Array.from(navigator.getGamepads?.()||[]).find(p=>p?.mapping==='standard')}catch{}
 const chord=!!(pad?.buttons[8]?.pressed&&pad?.buttons[9]?.pressed);
 if(chord&&!padChord)post('controller-menu');
 padChord=chord;
}
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const logError=(message)=>post('core-error',{message:String(message).slice(0,260)});
const setStage=(stage,extra={})=>post(stage,extra);
const layoutValues={classic:'top/bottom',side:'left/right',focus:'hybrid/top'};
const post=(event,details={})=>parent.postMessage({source:'astation-retro-player',event,...details},location.origin);
function mapControls(keys={}){
  const vals={0:['z','BUTTON_2'],1:['a','BUTTON_4'],2:['shift','SELECT'],3:['enter','START'],4:['up arrow','DPAD_UP'],5:['down arrow','DPAD_DOWN'],6:['left arrow','DPAD_LEFT'],7:['right arrow','DPAD_RIGHT'],8:['x','BUTTON_1'],9:['s','BUTTON_3'],10:['q','LEFT_TOP_SHOULDER'],11:['e','RIGHT_TOP_SHOULDER']};
  const n=['B','Y','Select','Start','Up','Down','Left','Right','A','X','L','R'];
  const d={};Object.entries(vals).forEach(([id,[key,pad]],i)=>d[id]={value:String(keys[n[i]]||key).toLowerCase(),value2:pad});
  return {0:d,1:{},2:{},3:{}};
}
function updateLayout(mode,manual=false){
 const value=layoutValues[mode]||layoutValues.classic;
 const em=window.EJS_emulator;
 // 'ready' fires before WebAssembly game startup. Applying core options then is premature.
 if(!gameStarted||!em?.gameManager?.setVariable){
   if(manual)post('layout-unsupported',{message:'Układ można zmienić po uruchomieniu gry w ustawieniach EmulatorJS (Core Options).'});
   return;
 }
 try{
   em.gameManager.setVariable('desmume_screens_layout',value);
   post('layout-ok',{mode});
 }catch(e){
   if(manual)post('layout-unsupported',{message:'Opcja układu niedostępna w tym rdzeniu. Użyj ustawień EmulatorJS.'});
 }
}
async function sendSave(){
 try {const gm=window.EJS_emulator?.gameManager; if(!gm?.saveSaveFiles)throw Error('Rdzeń nie jest gotowy.');await Promise.resolve(gm.saveSaveFiles());post('save-ok');}
 catch(e){post('save-error',{message:String(e.message||e)});}
}
async function snapshot(id){
 try{
  const gm=window.EJS_emulator?.gameManager;
  if(!gameStarted||typeof gm?.getState!=='function')throw Error('Rdzeń nie udostępnia Save State');
  const raw=await Promise.resolve(gm.getState());
  const bytes=raw instanceof Uint8Array?new Uint8Array(raw):raw instanceof ArrayBuffer?new Uint8Array(raw):null;
  if(!bytes?.byteLength||bytes.byteLength>64*1024*1024)throw Error('Nieprawidłowy rozmiar stanu');
  post('snapshot-result',{id,bytes});
 }catch(e){post('snapshot-result',{id,error:String(e.message||e)})}
}
async function restore(id,bytes){
 try{
  const gm=window.EJS_emulator?.gameManager;
  if(!gameStarted||typeof gm?.loadState!=='function'||!(bytes instanceof Uint8Array)||!bytes.byteLength)throw Error('Rdzeń nie udostępnia Load State');
  const result=await Promise.resolve(gm.loadState(bytes));
  if(result===false)throw Error('Rdzeń odrzucił stan');
  smart?.reset();post('restore-result',{id,accepted:true});
 }catch(e){post('restore-result',{id,error:String(e.message||e)})}
}
function start(cfg){
 if(launched)return;launched=true;
 window.EJS_player='#game';
 window.EJS_core=cfg.core==='desmume2015'?'desmume2015':'desmume';
 // Create this frame's own blob URL — iOS Safari can reject blob URLs created in a parent iframe.
 const localRom = cfg.romBlob instanceof Blob ? cfg.romBlob : null;
 if (!localRom && !cfg.url) {post('core-error',{message:'Nie odnaleziono lokalnego ROM-u. Wróć do biblioteki i zaimportuj plik.'});return;}
 window.EJS_gameUrl = localRom ? URL.createObjectURL(localRom) : cfg.url;
 window.addEventListener('pagehide',()=>{if(localRom)URL.revokeObjectURL(window.EJS_gameUrl)},{once:true});
 window.EJS_gameName='ASTATION_RETRO_'+cfg.profile+'_'+cfg.sha.slice(0,16);
 window.EJS_gameID=parseInt(cfg.sha.slice(0,7),16);
 window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
 // iOS Safari often needs a direct touch gesture to start audio/graphics.
 // Keep the official EmulatorJS Play button enabled instead of forced auto-start.
 window.EJS_startOnLoaded=!isIOS;
 window.EJS_startButtonName='Uruchom Nintendo DS';

 window.EJS_controlScheme='nds';
 window.EJS_volume=Math.max(0,Math.min(1,Number.isFinite(Number(cfg.volume))?Number(cfg.volume):0.55));
 window.EJS_color='#56b9ff';
 window.EJS_AdMode=0;
 window.EJS_threads=false;
 window.EJS_defaultControls=mapControls(cfg.keys);
 window.EJS_defaultOptions={'desmume_screens_layout':layoutValues[cfg.layout]||'top/bottom','desmume_pointer_mouse':'enabled','desmume_pointer_type':'touch','desmume_frameskip':String(Math.max(0,Math.min(4,Number(cfg.frameskip)||0))),'desmume_internal_resolution':cfg.performance==='quality'?'512x384':'256x192','desmume_advanced_timing':'disabled','desmume_gfx_texture_deposterize':'disabled'};
 window.EJS_fixedSaveInterval=10000;
 window.EJS_ready=()=>{
   document.getElementById('waiting').classList.add('hide');
   setStage('core-ready',{requiresTap:isIOS});
 };
 window.EJS_onGameStart=()=>{
   gameStarted=true;
   clearTimeout(startupTimer);
   setStage('game-started',{canSnapshot:typeof window.EJS_emulator?.gameManager?.getState==='function'&&typeof window.EJS_emulator?.gameManager?.loadState==='function'});
   // Core options may only be changed after the ROM is actually running.
   smart?.stop();
   smart=AstationSmartPerformance.create({getCore:()=>window.EJS_emulator,report:details=>post('performance',details),initial:cfg.frameskip,adaptive:cfg.performance==='balanced'||cfg.performance==='performance',active:()=>gameStarted&&!paused});
   smart.start();clearInterval(padTimer);padTimer=setInterval(checkPadShortcut,100);
   setTimeout(()=>updateLayout(cfg.layout,false),600);
 };
 window.EJS_onExit=()=>{gameStarted=false;smart?.stop();post('exited')};
 startupTimer=setTimeout(()=>{
   if(!gameStarted&&!isIOS)post('startup-slow',{message:'Gra nie rozpoczęła działania. Spróbuj lżejszego rdzenia DeSmuME 2015.'});
 },70000);
 const loader=document.createElement('script');loader.src='https://cdn.emulatorjs.org/stable/data/loader.js';loader.async=true;
 loader.onerror=()=>{document.getElementById('waiting').querySelector('small').textContent='Nie udało się pobrać rdzenia EmulatorJS. Sprawdź połączenie.';post('core-error',{message:'Nie można pobrać plików rdzenia EmulatorJS z zewnętrznego CDN. ROM jest nadal zapisany lokalnie. Spróbuj ponownie przy stabilnym połączeniu.'})};
 document.head.append(loader);
}
window.addEventListener('message',event=>{
 if(event.origin!==location.origin||event.source!==parent||event.data?.source!=='astation-retro-host')return;
 const d=event.data;
 switch(d.event){case 'start':start(d);break;case 'layout':updateLayout(d.layout,true);break;case 'fast':smart?.normalSpeed();break;case 'pause':paused=true;smart?.reset();window.EJS_emulator?.pause?.();break;case 'resume':paused=false;window.EJS_emulator?.play?.();smart?.reset();break;case 'save':sendSave();break;case 'snapshot':snapshot(d.id);break;case 'restore':restore(d.id,d.bytes);break;case 'volume':window.EJS_emulator?.setVolume?.(Math.max(0,Math.min(1,+d.value)));break;case 'restart':if(window.EJS_emulator?.gameManager?.restart){window.EJS_emulator.gameManager.restart();smart?.reset();post('restart-ok')}else post('core-error',{message:'Restart jest niedostępny w obecnym rdzeniu'});break;case 'fullscreen':window.EJS_emulator?.toggleFullscreen?.(true);break;}
});
window.addEventListener('pagehide',()=>{smart?.stop();clearInterval(padTimer)});
window.addEventListener('error',e=>{if(launched)logError(e.message||'Błąd emulacji')});
window.addEventListener('unhandledrejection',e=>{
  if(launched&&!gameStarted)logError(e.reason?.message||e.reason||'Nie udało się rozpocząć emulacji');
});
post('player-ready');
</script></body></html>
